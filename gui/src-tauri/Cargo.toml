[package]
name = "mabi-patcher"
version = "2.0.2"
description = "mabi-patcher: Mabinogi Archive & Patcher Suite"
authors = ["ShaggyZE <shaggyze@gmail.com>"]
edition = "2021"

[lib]
name = "mabi_pack2_gui_lib"
path = "src/lib.rs"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mabi_pack2 = { package = "mabi-pack2-core", path = "../.." }
anyhow = "1"
log = "0.4"
simplelog = "0.12"
image = { version = "0.25", default-features = false, features = ["dds", "png"] }
image_dds = "0.7"
clap = "~3.2.25"
walkdir = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-shell = "2"
base64 = "0.22"
flate2 = "1"
rayon = "1"
sha1 = "0.10"
ureq = { version = "2", features = ["native-tls"] }
filetime = "0.2"
directories = "5.0"
sysinfo = "0.38.4"
once_cell = "1.19"
encoding_rs = "0.8"
toml = { version = "0.8", features = ["parse"] }
tiny_http = "0.12"
tokio = { version = "1.53.1", features = ["time"] }
aes-gcm = "0.11.1"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"
winapi = { version = "0.3", features = ["shellapi", "winuser", "securitybaseapi", "processthreadsapi", "winnt", "shlobj", "std"] }

[profile.release]
opt-level = 3
lto = false
codegen-units = 16
panic = 'abort'
