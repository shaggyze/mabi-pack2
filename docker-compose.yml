services:
  mabi-patcher:
    build: .
    container_name: mabi-patcher
    restart: unless-stopped
    ports:
      - "7331:7331"
    volumes:
      # Mount your Mabinogi archive directory (read-only is fine for list/extract)
      - /opt/mabinogi/data:/data/archives:ro
      # Mount your mods directory (read-write so the WebUI can write .mod files)
      - ./mods:/data/mods
    environment:
      MABI_HOST: "0.0.0.0"
      MABI_PORT: "7331"
      RUST_LOG: "info"
      # Required — the server refuses to serve any non-loopback bind (this
      # one, since it's 0.0.0.0) without a token. Set this via a `.env` file
      # or `MABI_API_TOKEN=... docker compose up`, don't hardcode it here.
      MABI_API_TOKEN: "${MABI_API_TOKEN:?set MABI_API_TOKEN before starting}"
    healthcheck:
      test: ["CMD", "curl", "-sf", "-H", "Authorization: Bearer ${MABI_API_TOKEN}", "http://localhost:7331/api/v1/status"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
